<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contactos · Faena</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0b1f33; --blue: #2f5bff; --cyan: #1fc8e3;
  --bg: #f9fafb; --surface: #fff; --surface-2: #f1f5f9; --text: #0f1729; --muted: #64748b; --border: #e1e7ef;
  --accent: #2f5bff; --accent-soft: #eef2ff;
  --nuevo: #2f5bff; --contactado: #b7791f; --en_curso: #0e9aa7; --cerrado: #64748b;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
header { background: var(--surface); border-bottom: 3px solid var(--cyan); }
.bar { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 14px; }
.bar .logo { height: 34px; width: auto; display: block; }
.bar h1 { font-size: 17px; margin: 0; color: var(--navy); }
.bar .sub { color: var(--muted); font-size: 12.5px; }
.bar .right { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; }
main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 40px; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; cursor: pointer; text-align: left; font: inherit; color: inherit; transition: border-color .15s; }
.stat:hover, .stat.active { border-color: var(--accent); }
.stat .k { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stat .k i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.stat .v { font-size: 26px; font-weight: 700; margin-top: 2px; color: var(--navy); font-variant-numeric: tabular-nums; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; }
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(47, 91, 255, .3); border-color: var(--accent); }
.filters input[type=search] { flex: 1; min-width: 220px; }
button, a.btn { font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px; padding: 7px 14px; border: 1px solid var(--accent); background: var(--accent); color: #fff; text-decoration: none; display: inline-block; }
button.ghost, a.btn.ghost { background: transparent; color: var(--navy); border-color: var(--border); font-weight: 500; }
button:disabled { opacity: .5; cursor: default; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; background: var(--surface-2); }
td.wrap { white-space: normal; min-width: 180px; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.sel { background: var(--accent-soft); }
tbody tr:last-child td { border-bottom: none; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
.muted { color: var(--muted); }
.strong { font-weight: 600; color: var(--navy); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: color-mix(in srgb, var(--c) 13%, transparent); color: var(--c); }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.empty { padding: 48px; text-align: center; color: var(--muted); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); border-left: 1px solid var(--border); box-shadow: -12px 0 40px rgba(11, 31, 51, .12); transform: translateX(100%); transition: transform .22s ease; display: flex; flex-direction: column; z-index: 10; }
.drawer.open { transform: none; }
.drawer-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
.drawer-head h2 { font-size: 18px; margin: 4px 0 0; color: var(--navy); }
.drawer-head .x { margin-left: auto; padding: 4px 10px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 18px 22px 24px; }
.fields { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; margin: 0 0 14px; }
.fields dt { color: var(--muted); font-size: 12.5px; }
.fields dd { margin: 0; overflow-wrap: anywhere; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 22px 0 10px; }
.desc { background: var(--surface-2); border-left: 3px solid var(--cyan); border-radius: 6px; padding: 12px 14px; white-space: pre-wrap; }
.actions { background: var(--surface-2); border-radius: 8px; padding: 14px; display: grid; gap: 10px; }
.actions .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.actions textarea { width: 100%; min-height: 64px; resize: vertical; }
.actions .msg { font-size: 12.5px; }
.timeline { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--border); }
.timeline li { position: relative; padding: 0 0 12px 16px; white-space: pre-wrap; }
.timeline li::before { content: ''; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.timeline .when { font-size: 12px; color: var(--muted); }
.chat { display: flex; flex-direction: column; gap: 8px; }
.bubble { max-width: 88%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; }
.bubble.user { align-self: flex-end; background: var(--navy); color: #fff; }
.bubble.assistant { align-self: flex-start; background: var(--surface-2); }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.file { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface-2); text-decoration: none; color: inherit; display: flex; flex-direction: column; }
.file:hover { border-color: var(--accent); }
.file .thumb { height: 100px; display: grid; place-items: center; background: var(--surface); font-size: 30px; }
.file .thumb img { width: 100%; height: 100%; object-fit: cover; }
.file .info { padding: 7px 9px; font-size: 12px; }
.file .info b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clip { color: var(--muted); font-size: 12px; margin-left: 6px; }
/* visor de evidencias */
.viewer { position: fixed; inset: 0; z-index: 30; background: rgba(10, 12, 16, .93); display: flex; flex-direction: column; }
.viewer[hidden] { display: none; }
.v-bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.v-bar .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v-bar .meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.v-bar .acts { margin-left: auto; display: flex; gap: 8px; flex: none; }
.v-bar a.btn { font-weight: 500; text-decoration: none; border-radius: 8px; padding: 7px 14px; border: 1px solid var(--border); color: var(--text); background: var(--surface); }
.v-body { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 20px; }
.v-body .loading, .v-body .msg { color: #fff; margin: auto; font-size: 14px; }
.v-body > img { max-width: 100%; max-height: calc(100vh - 110px); margin: auto; border-radius: 6px; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.4); cursor: zoom-in; }
.v-body > img.zoom { max-width: none; max-height: none; cursor: zoom-out; }
.pdf-pages { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.pdf-pages canvas { background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.35); max-width: 100%; height: auto; }
.textview { width: min(1100px, 100%); background: var(--surface); border-radius: 10px; overflow: auto; margin: 0; font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 12px 0; }
.textview .ln { display: flex; padding: 0 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.textview .ln::before { content: attr(data-n); color: var(--muted); min-width: 4.5ch; margin-right: 14px; text-align: right; flex: none; user-select: none; }
.textview .ln.err { background: color-mix(in srgb, #dc2626 14%, transparent); }
.textview .ln.warn { background: color-mix(in srgb, #d97706 12%, transparent); }
.docframe { width: min(900px, 100%); height: calc(100vh - 110px); border: none; border-radius: 8px; background: #fff; }
.sheetview { width: min(1200px, 100%); background: var(--surface); border-radius: 10px; overflow: hidden; }
.sheet-tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.sheet-tabs button { border-radius: 8px 8px 0 0; padding: 6px 12px; }
.sheet-tabs button:not(.on) { background: transparent; color: var(--text); border-color: transparent; font-weight: 500; }
.sheet-wrap { overflow: auto; max-height: calc(100vh - 170px); }
.sheet-wrap table td, .sheet-wrap table th { border: 1px solid var(--border); padding: 5px 9px; font-size: 12.5px; white-space: pre; }
.sheet-wrap table th { position: sticky; top: 0; }
.bubble .att { display: block; margin-top: 4px; font-size: 12px; opacity: .75; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 9px 16px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; }
@media (max-width: 800px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } main, .bar { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <img src="/logo.png" alt="Faena CS" class="logo">
    <div><h1>Solicitudes de contacto</h1><div class="sub">Asistente Faena-Bot · faenacs</div></div>
    <div class="right"><span id="updated"></span><button class="ghost" id="refresh">Actualizar</button></div>
  </div>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div class="filters">
    <input type="search" id="q" placeholder="Buscar por nombre, empresa, correo, área, necesidad o sitio…">
    <select id="f-estado"><option value="">Todos los estados</option></select>
  </div>
  <div class="card"><div class="table-wrap">
    <table>
      <thead><tr><th>N.º</th><th>Fecha</th><th>Estado</th><th>Contacto</th><th>Empresa</th><th>Correo</th><th>Área de interés</th><th>Sitio</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div><div class="empty" id="empty" hidden>No hay solicitudes con estos filtros.</div></div>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div><div id="d-meta"></div><h2 id="d-title"></h2></div>
    <button class="ghost x" id="d-close" aria-label="Cerrar">✕</button>
  </div>
  <div class="drawer-body" id="d-body"></div>
</aside>
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="v-name">
  <div class="v-bar">
    <span class="name" id="v-name"></span><span class="meta" id="v-meta"></span>
    <div class="acts">
      <button class="ghost" id="v-prev" title="Anterior (←)">‹</button>
      <button class="ghost" id="v-next" title="Siguiente (→)">›</button>
      <a class="btn" id="v-download" href="#">Descargar</a>
      <button class="ghost" id="v-close" title="Cerrar (Esc)">✕</button>
    </div>
  </div>
  <div class="v-body" id="v-body"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const ESTADOS = { nuevo: 'Nuevo', contactado: 'Contactado', en_curso: 'En conversación', cerrado: 'Cerrado' };
const $ = s => document.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const fmt = iso => { const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString('es', { dateStyle: 'short', timeStyle: 'short' }); };
const blank = v => !v || /^no informad/i.test(v);
const badge = e => el('span', { className: 'badge', textContent: ESTADOS[e] || e, style: `--c: var(--${e in ESTADOS ? e : 'cerrado'})` });
function toast(t) { const n = $('#toast'); n.textContent = t; n.classList.add('show'); clearTimeout(n._t); n._t = setTimeout(() => n.classList.remove('show'), 2400); }

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Gestion': '1' } });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || 'Error ' + res.status);
  return data;
}

let current = null, estadoFiltro = '';

async function load() {
  const qs = new URLSearchParams();
  if (estadoFiltro) qs.set('estado', estadoFiltro);
  if ($('#q').value.trim()) qs.set('texto', $('#q').value.trim());
  let data;
  try { data = await api('/api/contactos?' + qs); }
  catch (e) { toast('No se pudo cargar: ' + e.message); return; }
  renderStats(data.conteo || {});
  const tb = $('#rows'); tb.innerHTML = '';
  for (const c of data.contactos) {
    const tr = el('tr', {},
      el('td', { className: 'mono', textContent: c.id }),
      el('td', { className: 'muted', textContent: fmt(c.fecha) }),
      el('td', {}, badge(c.estado)),
      el('td', {}, el('div', { className: 'strong', textContent: blank(c.nombre) ? '(sin nombre)' : c.nombre }), el('div', { className: 'muted', textContent: blank(c.cargo) ? '' : c.cargo })),
      el('td', { textContent: blank(c.empresa) ? '—' : c.empresa }),
      el('td', {}, ...[c.correo, c.telefono, c.otro].filter(v => !blank(v)).map((v, i) => el('div', { className: i ? 'muted' : '', textContent: v }))),
      el('td', { className: 'wrap muted' }, c.interes || '—', c.adjuntos ? el('span', { className: 'clip', textContent: ` 📎 ${c.adjuntos}`, title: `${c.adjuntos} archivo(s)` }) : ''),
      el('td', { className: 'muted', textContent: c.sitio || '—' }));
    if (c.id === current) tr.classList.add('sel');
    tr.onclick = () => openContact(c.id);
    tb.append(tr);
  }
  $('#empty').hidden = data.contactos.length > 0;
  $('#updated').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es', { timeStyle: 'short' });
}

function renderStats(c) {
  const items = [['', 'Todas', Object.values(c).reduce((a, b) => a + b, 0), 'var(--navy)'],
    ...Object.entries(ESTADOS).map(([k, v]) => [k, v, c[k] || 0, `var(--${k})`])];
  const box = $('#stats'); box.innerHTML = '';
  for (const [k, label, n, color] of items) {
    const b = el('button', { className: 'stat' + (estadoFiltro === k ? ' active' : ''), type: 'button' },
      el('div', { className: 'k', style: `--c: ${color}` }, el('i'), label), el('div', { className: 'v', textContent: n }));
    b.onclick = () => { estadoFiltro = k; $('#f-estado').value = k; load(); };
    box.append(b);
  }
}

async function openContact(id) {
  current = id;
  document.querySelectorAll('tbody tr').forEach(tr => tr.classList.toggle('sel', tr.firstChild.textContent === id));
  let c;
  try { c = await api('/api/contactos/' + encodeURIComponent(id)); }
  catch (e) { toast(e.message); return; }
  $('#d-meta').replaceChildren(el('span', { className: 'mono muted', textContent: c.id + '  ' }), badge(c.estado));
  $('#d-title').textContent = [c.nombre, c.empresa].filter(v => !blank(v)).join(' · ') || 'Sin nombre';
  const body = $('#d-body'); body.innerHTML = '';

  const dl = el('dl', { className: 'fields' });
  for (const [k, v] of [['Nombre', c.nombre], ['Cargo', c.cargo], ['Empresa', c.empresa], ['Correo', c.correo], ['Teléfono', c.telefono], ['Otro contacto', c.otro], ['Preferencia', c.preferencia],
    ['Área de interés', c.interes], ['Sitio', c.sitio], ['Recibida', fmt(c.fecha)]])
    dl.append(el('dt', { textContent: k }), el('dd', { textContent: blank(v) ? '—' : v }));
  const asunto = encodeURIComponent((c.sitio === 'web-vercel-zeta-red.vercel.app' ? 'Faena Growth Partner · ' : '') + 'Tu solicitud ' + c.id);
  const saludo = encodeURIComponent(`Hola${blank(c.nombre) ? '' : ' ' + c.nombre.split(' ')[0]}:\n\nGracias por contactarnos a través de nuestro sitio. `);
  const quick = el('div', { className: 'quick' });
  if (!blank(c.correo) && c.correo.includes('@')) quick.append(el('a', { className: 'btn', href: `mailto:${c.correo}?subject=${asunto}&body=${saludo}`, textContent: '✉️ Responder por correo' }));
  if (!blank(c.telefono)) {
    const digits = c.telefono.replace(/[^\d]/g, '');
    quick.append(el('a', { className: 'btn ghost', href: 'tel:' + c.telefono.replace(/[^\d+]/g, ''), textContent: '📞 ' + c.telefono }),
      el('a', { className: 'btn ghost', href: 'https://wa.me/' + digits, target: '_blank', rel: 'noopener', textContent: '💬 WhatsApp' }));
  }
  body.append(dl, quick, el('h3', { textContent: 'Necesidad' }), el('div', { className: 'desc', textContent: c.necesidad }));

  const sel = el('select'); for (const [k, v] of Object.entries(ESTADOS)) sel.append(el('option', { value: k, textContent: v, selected: k === c.estado }));
  const txt = el('textarea', { placeholder: 'Nota para el historial (opcional): p. ej. «Llamé, reunión el jueves»…' });
  const save = el('button', { type: 'button', textContent: 'Guardar' });
  const msg = el('span', { className: 'msg muted' });
  save.onclick = async () => {
    const args = {};
    if (sel.value !== c.estado) args.estado = sel.value;
    if (txt.value.trim()) args.nota = txt.value.trim();
    if (!Object.keys(args).length) { msg.textContent = 'Cambia el estado o escribe una nota.'; return; }
    save.disabled = true; msg.textContent = 'Guardando…';
    try { await api('/api/contactos/' + encodeURIComponent(c.id), { method: 'POST', body: JSON.stringify(args) }); toast(`${c.id} actualizada`); await load(); await openContact(c.id); }
    catch (e) { msg.textContent = e.message; save.disabled = false; }
  };
  body.append(el('h3', { textContent: 'Gestionar' }),
    el('div', { className: 'actions' }, el('div', { className: 'row' }, el('label', { className: 'muted', textContent: 'Estado' }), sel), txt, el('div', { className: 'row' }, save, msg)));

  if (c.adjuntos?.length) {
    const grid = el('div', { className: 'files' });
    const size = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
    c.adjuntos.forEach((a, i) => {
      const isImg = /^image\/(png|jpeg|gif|webp)$/.test(a.tipo);
      const icon = a.tipo === 'application/pdf' ? '📕' : /sheet|excel/.test(a.tipo) ? '📊' : /word/.test(a.tipo) ? '📘' : '📄';
      const link = el('a', { className: 'file', href: `/api/adjuntos/${a.id}?descargar`, title: `${a.nombre}\nSHA-256: ${a.sha256}` },
        el('div', { className: 'thumb' }, isImg ? el('img', { src: `/api/adjuntos/${a.id}`, alt: a.nombre, loading: 'lazy' }) : icon),
        el('div', { className: 'info' }, el('b', { textContent: a.nombre }), el('span', { className: 'muted', textContent: `${size(a.tamano)} · ${viewable(a) ? 'ver' : 'descargar'}` })));
      if (viewable(a)) link.onclick = e => { e.preventDefault(); openViewer(c.adjuntos, i); };
      grid.append(link);
    });
    body.append(el('h3', { textContent: `Archivos (${c.adjuntos.length})` }), grid);
  }
  if (c.notas.length) {
    const ul = el('ul', { className: 'timeline' });
    for (const n of c.notas) ul.append(el('li', {}, el('div', { className: 'when', textContent: fmt(n.fecha) }), el('div', { textContent: n.texto })));
    body.append(el('h3', { textContent: 'Historial' }), ul);
  }
  if (c.conversacion.length) {
    const chat = el('div', { className: 'chat' });
    for (const m of c.conversacion) {
      const b = el('div', { className: 'bubble ' + (m.rol === 'user' ? 'user' : 'assistant'), textContent: m.texto || '' });
      if (m.adjuntos?.length) b.append(el('span', { className: 'att', textContent: '📎 ' + m.adjuntos.join(', ') }));
      chat.append(b);
    }
    body.append(el('h3', { textContent: 'Conversación con Faena-Bot' }), chat);
  }
  $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden', 'false');
}

// ---------- visor de archivos ----------
// Todo se dibuja dentro de la página a partir de los bytes (nunca se ejecuta ni se incrusta el archivo tal cual).
const CDN = 'https://cdnjs.cloudflare.com/ajax/libs/';
const LIBS = { pdf: CDN + 'pdf.js/3.11.174/pdf.min.js', pdfWorker: CDN + 'pdf.js/3.11.174/pdf.worker.min.js',
               docx: CDN + 'mammoth/1.6.0/mammoth.browser.min.js', xlsx: CDN + 'xlsx/0.18.5/xlsx.full.min.js' };
const loaded = {};
const loadScript = src => loaded[src] ||= new Promise((ok, ko) => {
  const sc = el('script', { src, async: true }); sc.onload = ok;
  sc.onerror = () => { delete loaded[src]; ko(new Error('No se pudo cargar el visor (necesita internet la primera vez)')); };
  document.head.append(sc);
});
const kind = a => /^image\/(png|jpeg|gif|webp)$/.test(a.tipo) ? 'image' : a.tipo === 'application/pdf' ? 'pdf'
  : a.tipo.startsWith('text/') ? 'text' : /wordprocessingml/.test(a.tipo) ? 'docx' : /spreadsheetml|ms-excel/.test(a.tipo) ? 'sheet' : null;
const viewable = a => !!kind(a);
let vList = [], vIdx = 0, vToken = 0;
const bytesOf = async a => { const r = await fetch(`/api/adjuntos/${a.id}?descargar`); if (!r.ok) throw new Error('No se pudo leer el archivo'); return r.arrayBuffer(); };

function openViewer(list, idx) {
  vList = list.filter(viewable); vIdx = Math.max(0, vList.indexOf(list[idx]));
  $('#viewer').hidden = false; showCurrent();
}
function closeViewer() { vToken++; $('#viewer').hidden = true; $('#v-body').replaceChildren(); }
function move(d) { if (vList.length > 1) { vIdx = (vIdx + d + vList.length) % vList.length; showCurrent(); } }
async function showCurrent() {
  const a = vList[vIdx], token = ++vToken, body = $('#v-body');
  const size = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
  $('#v-name').textContent = a.nombre;
  $('#v-meta').textContent = `${size(a.tamano)}` + (vList.length > 1 ? ` · ${vIdx + 1} de ${vList.length}` : '');
  $('#v-download').href = `/api/adjuntos/${a.id}?descargar`;
  $('#v-prev').hidden = $('#v-next').hidden = vList.length < 2;
  body.replaceChildren(el('div', { className: 'loading', textContent: 'Cargando…' }));
  const stale = () => token !== vToken;
  try {
    const k = kind(a);
    if (k === 'image') {
      const img = el('img', { src: `/api/adjuntos/${a.id}`, alt: a.nombre, title: 'Clic para ver a tamaño real' });
      img.onclick = () => img.classList.toggle('zoom');
      img.onload = () => { if (!stale()) body.replaceChildren(img); };
      img.onerror = () => { if (!stale()) body.replaceChildren(el('div', { className: 'msg', textContent: 'No se pudo mostrar la imagen.' })); };
    } else if (k === 'pdf') {
      const [buf] = await Promise.all([bytesOf(a), loadScript(LIBS.pdf)]);
      pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
      const pdf = await pdfjsLib.getDocument({ data: buf, isEvalSupported: false }).promise;
      if (stale()) return;
      const pages = el('div', { className: 'pdf-pages' });
      body.replaceChildren(pages);
      const n = Math.min(pdf.numPages, 50), width = Math.min(body.clientWidth - 40, 1000);
      for (let i = 1; i <= n && !stale(); i++) {
        const page = await pdf.getPage(i), vp1 = page.getViewport({ scale: 1 });
        const vp = page.getViewport({ scale: (width / vp1.width) * (window.devicePixelRatio || 1) });
        const c = el('canvas', { width: vp.width, height: vp.height }); c.style.width = width + 'px';
        pages.append(c);
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      }
      if (pdf.numPages > n) pages.append(el('div', { className: 'msg', textContent: `Se muestran ${n} de ${pdf.numPages} páginas. Descárgalo para ver el resto.` }));
    } else if (k === 'text') {
      const buf = await bytesOf(a); if (stale()) return;
      let text = new TextDecoder('utf-8').decode(buf);
      if (text.includes('�')) text = new TextDecoder('latin1').decode(buf);
      const lines = text.split(/\r?\n/), MAX = 20000;
      const pre = el('pre', { className: 'textview' });
      lines.slice(0, MAX).forEach((l, i) => {
        const cls = /\b(ERROR|FATAL|SEVERE|CRITICAL)\b|Exception|Traceback|\bfailed\b/i.test(l) ? ' err' : /\bWARN(ING)?\b/i.test(l) ? ' warn' : '';
        const ln = el('span', { className: 'ln' + cls, textContent: l || ' ' });
        ln.dataset.n = i + 1;
        pre.append(ln);
      });
      if (lines.length > MAX) pre.append(el('span', { className: 'ln', textContent: `… (${lines.length - MAX} líneas más; descárgalo para verlo completo)` }));
      body.replaceChildren(pre);
    } else if (k === 'docx') {
      const [buf] = await Promise.all([bytesOf(a), loadScript(LIBS.docx)]);
      const { value } = await mammoth.convertToHtml({ arrayBuffer: buf });
      if (stale()) return;
      // marco aislado sin scripts: el contenido del documento no puede ejecutar nada ni navegar
      const frame = el('iframe', { className: 'docframe', title: a.nombre });
      frame.setAttribute('sandbox', '');
      frame.srcdoc = `<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'"><style>body{font:15px/1.6 -apple-system,Segoe UI,sans-serif;color:#1a1a1a;max-width:760px;margin:32px auto;padding:0 24px}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px 8px}img{max-width:100%}</style>${value || '<p><em>(documento vacío)</em></p>'}`;
      body.replaceChildren(frame);
    } else if (k === 'sheet') {
      const [buf] = await Promise.all([bytesOf(a), loadScript(LIBS.xlsx)]);
      const wb = XLSX.read(buf, { type: 'array' });
      if (stale()) return;
      const view = el('div', { className: 'sheetview' }), tabs = el('div', { className: 'sheet-tabs' }), wrap = el('div', { className: 'sheet-wrap' });
      const show = name => {
        tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.textContent === name));
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, blankrows: false, defval: '' }).slice(0, 1000);
        const cols = Math.max(0, ...rows.map(r => r.length));
        const table = el('table');
        const head = el('tr', {}, el('th', { textContent: '' }));
        for (let c = 0; c < cols; c++) head.append(el('th', { textContent: XLSX.utils.encode_col(c) }));
        table.append(el('thead', {}, head));
        const tb = el('tbody');
        rows.forEach((r, i) => { const tr = el('tr', {}, el('th', { textContent: i + 1 })); for (let c = 0; c < cols; c++) tr.append(el('td', { textContent: r[c] ?? '' })); tb.append(tr); });
        table.append(tb); wrap.replaceChildren(table);
      };
      for (const name of wb.SheetNames) tabs.append(el('button', { type: 'button', textContent: name, onclick: () => show(name) }));
      view.append(tabs, wrap); body.replaceChildren(view); show(wb.SheetNames[0]);
    }
  } catch (e) {
    if (!stale()) body.replaceChildren(el('div', { className: 'msg', textContent: `${e.message}. Puedes descargarlo con el botón de arriba.` }));
  }
}
$('#v-close').onclick = closeViewer;
$('#v-prev').onclick = () => move(-1);
$('#v-next').onclick = () => move(1);
$('#viewer').addEventListener('click', e => { if (e.target.id === 'v-body') closeViewer(); });

function closeDrawer() { current = null; $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true'); document.querySelectorAll('tbody tr.sel').forEach(tr => tr.classList.remove('sel')); }

for (const [k, v] of Object.entries(ESTADOS)) $('#f-estado').append(el('option', { value: k, textContent: v }));
$('#f-estado').onchange = e => { estadoFiltro = e.target.value; load(); };
let qTimer; $('#q').oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(load, 250); };
$('#refresh').onclick = load;
$('#d-close').onclick = closeDrawer;
document.addEventListener('keydown', e => {
  if (!$('#viewer').hidden) {
    if (e.key === 'Escape') closeViewer(); else if (e.key === 'ArrowLeft') move(-1); else if (e.key === 'ArrowRight') move(1);
    return;
  }
  if (e.key === 'Escape') closeDrawer();
});
load();
setInterval(() => { if (!document.hidden) load(); }, 15000);
</script>
</body>
</html>
